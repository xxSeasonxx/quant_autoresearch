# Agent-editable bounded strategy params for the active thesis.
#
# The agent tunes [params] within the matching [bounds.*]. Every numeric param
# needs a bound; the loop rejects an out-of-bounds value before a run starts.
#
# These are the neutral template params. Replace them with the active thesis's
# params and bounds when a new thesis starts.

[params]
# Long weight-of-NAV target held while the trend is up.
weight = 0.25
# Bars between the two closes compared for the up/down trend signal.
lookback_bars = 60

[bounds.weight]
min = 0.05
max = 1.0

[bounds.lookback_bars]
min = 1
max = 240
