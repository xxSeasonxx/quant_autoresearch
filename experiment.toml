# experiment.toml — the agent-editable hypothesis surface (FR-H1).
#
# This is HALF of the two-file editable surface (the other is strategy.py). It carries ONLY the
# strategy reference + its params (+ an optional bounded discovery `symbols` set). It says nothing
# about how the candidate is judged — that lives in protocol.toml (harness-owned, read-only).
# The schema is strict (`extra = "forbid"`): the legacy keys (windows, scoring, promotion,
# max_attempts, cost_model, fill_model) are GONE and would be rejected here — judgment config is
# the Protocol's, not the agent's.

strategy_path = "strategy.py"

# Optional bounded discovery universe. Omit to use the Protocol's `data_tiers.symbols`.
symbols = ["BTCUSDT", "ETHUSDT", "SOLUSDT", "ADAUSDT"]

[params]
# The agent tunes these (the harness perturbs them for the stability gate; sizing is frozen).
lookback_bars = 24
entry_threshold = 0.01
base_position_pct = 0.05
max_hold_bars = 24
decision_lag_minutes = 60
