[params]
lookback_days = 30
signal = "sign"
blend = false
skip_days = 0
rebalance_days = 1
decision_lag_minutes = 1
confirm_lookback_days = 0
vol_scale = false
vol_lookback_days = 60
trend_method = "return"
weighting = "inverse_vol"
gross_mode = "tilted"
top_n = 0
execution_bars = 20
signal_band = 0.0
position_smoothing = 2

# Bounded search space: the ranges this thesis needs tested, not pinned to the
# baseline. `signal` (sign/long_flat), `blend` (bool), `trend_method`, `weighting`, and
# `gross_mode` (universe/active/tilted) are categorical — the loop toggles the value directly, so
# they carry no numeric bounds.
# `lookback_days` is the main data-snooping surface: keep it on a coarse grid and do not
# fine-tune. `decision_lag_minutes` is pinned by causality. `top_n` caps the active book
# (0 = no cap; the universe holds 3 names).

[bounds.lookback_days]
min = 20
max = 180

[bounds.skip_days]
min = 0
max = 15

[bounds.rebalance_days]
min = 1
max = 7

[bounds.decision_lag_minutes]
min = 1
max = 1

[bounds.confirm_lookback_days]
min = 0
max = 200

[bounds.vol_lookback_days]
min = 10
max = 90

[bounds.top_n]
min = 0
max = 3

[bounds.execution_bars]
min = 1
max = 30

[bounds.signal_band]
min = 0.0
max = 0.5

[bounds.position_smoothing]
min = 1
max = 20
