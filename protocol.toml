# Operator-owned Train-loop protocol. The agent reads this file but does not
# change it during a thesis run.

strategy_path = "strategy.py"
strategy_id = "strategy"

[data]
kind = "bars"
dataset = "crypto_perp_1min"
symbols = ["BTC-PERP", "ETH-PERP"]
start = "2025-01-01"
end = "2025-02-01"

[fill_model]
price = "close"
entry_lag_bars = 1
exit_lag_bars = 0

[cost_model]
fee_bps_per_side = 5.0
slippage_bps_per_side = 1.0

[output]
results_dir = "results"
artifact_profile = "summary"
quick_checks = true
diagnostic_sample_trades = 5

[loop]
plateau_patience = 4
max_iterations = 60
min_abs_improvement = 0.01
min_rel_improvement = 0.0
baseline_grace_iterations = 3

[objective]
kind = "worst_subwindow"
subwindows = 2

[gates]
min_trades = 4
max_symbol_concentration = 0.80
min_cost_stress_score = 0.0
max_components = 3
max_params = 8
train_score_floor = 0.0
