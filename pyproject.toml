[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-autoresearch"
version = "0.1.0"
description = "Local autoresearch workbench for one scratch quant strategy."
requires-python = ">=3.12"
dependencies = [
    "quant-strategies",
]

[tool.pytest.ini_options]
# --import-mode=importlib is pytest's recommended mode; it avoids sys.path-prepend import
# collisions and shields the mirrored `tests/harness/` layout from shadowing the real
# `harness/` package.
# The legacy judgment shell is fully retired (no `runner.py`/`scoring.py`/`promotion.py`/
# `experiment_config.py`/`artifact_policy.py`/`tools/`), so there is no ignored test and no
# legacy module left to exclude — the whole suite is the new world.
addopts = "-ra --import-mode=importlib"
pythonpath = ["."]
testpaths = ["tests"]
