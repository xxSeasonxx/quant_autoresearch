[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-autoresearch"
version = "0.1.0"
description = "Local autoresearch workbench for one scratch quant strategy."
requires-python = ">=3.12"
dependencies = [
    "quant-strategies",
]

[project.scripts]
quant-autoresearch = "loop:main"

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
exclude = [
    "^results/",
    "^\\.autoresearch/",
]

[[tool.mypy.overrides]]
module = ["quant_data.*", "quant_strategies.*"]
ignore_missing_imports = true
